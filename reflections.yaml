  - id: from-circuits-to-people
    title: "From circuits to people"
    text: >-
      I started out in optoelectronics and electrical engineering, soldering boards and worrying
      about signal-to-noise ratios. Moving into human-centered computing didn't mean leaving the
      hardware bench. It meant realizing that the most complex, noisy, and fascinating part of any
      circuit is the human holding it.
    source: "Gemini Argon draft (R3, Oct 24, 2026), filling this slot; CV facts"
