reflections:
  - id: progress-not-perfection
    title: "Progress, not perfection"
    text: >-
      The people closest to me taught me to pick my fights wisely, to let go of what I cannot
      control, and to seek progress, not perfection. Reflecting a little more each day and moving
      forward bit by bit is how anything worth doing gets done.
    source: "Dissertation acknowledgments (Oct 2026), lightly condensed"
    tags: [life]
    photo: TODO
    status: draft
