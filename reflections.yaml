  # ── Drafts written by Gemini Argon in Jimmy's voice (Oct 24, 2026). Jimmy checks every detail. ──
  - id: multimeter
    title: "Pick up the multimeter"
    text: >-
      Whether it's a silent clothes dryer, a vacuum hose on an aging V6 engine, or an AI pipeline
      that hallucinates, my favorite moment is always the same: putting down the guesswork, picking
      up a multimeter, and finding out where the signal actually breaks.
    source: "Gemini Argon draft (R1), from home repairs Jimmy has described"
    tags: [building, life]
    photo: TODO   # an object photo (multimeter, workbench)
    status: draft
  - id: midnight-tabs
    title: "The tabs we leave open"
    text: >-
      If you ask someone point-blank, "What are your interests?", most of us freeze and offer a safe
      label. What we care about rarely announces itself on command. It shows up in the tabs we leave
      open at midnight and in the tangents we take when explaining something we love.
    source: "Gemini Argon draft (R2); echoes Study 1 (29% gave only the name) and Study 2"
    tags: [research]
    photo: TODO
    status: draft
  - id: braised-pork
    title: "Some things can't be rushed"
    text: >-
      Simmering a pot of braised pork or shaping taro balls by hand teaches a rhythm that fast-moving
      tech often forgets: some things can't be rushed by turning up the heat. Good research, like a
      good pot of lurou, needs quiet time for the flavors to settle in.
    source: "Gemini Argon draft (R4), from Jimmy's cooking"
    tags: [life]
    photo: TODO   # food close-up
    status: draft
  - id: dotted-line
    title: "A dotted line under the machine's confidence"
    text: >-
      Today's language models are breathtakingly fluent at connecting dots, even dots that were never
      there. Part of my job is to draw a dotted line under the machine's confidence and ask: did the
      person actually leave this trace, or did you just make an eloquent guess?
    source: "Gemini Argon draft (R5); the grounded/inferred check (505 of 1,130 units inferred)"
    tags: [research]
    photo: TODO
    status: draft
  - id: kayak
    title: "Quiet paddling"
    text: >-
      On a quiet Florida lake in a kayak, the water looks completely still until your paddle catches
      the current underneath. Graduate school felt a lot like that: long stretches of quiet paddling
      before anyone on the shore notices the boat has moved.
    source: "Gemini Argon draft (R6), from Jimmy's kayaking"
    tags: [life]
    photo: TODO   # lake photo without people
    status: draft
  - id: building-a-bridge
    title: "Building a bridge"
    text: >-
      You never fully understand an algorithm until you try explaining it to a room of undergraduates
      who haven't had their coffee yet. When an analogy from their own world makes a hash table click
      in thirty seconds, that isn't dumbing it down. It's building a bridge.
    source: "Gemini Argon draft (R7), COP 3530 discussion sections; '150' removed (that's the total across sections)"
    tags: [teaching]
    photo: TODO
    status: draft
  - id: showing-up
    title: "Showing up for the next match"
    text: >-
      Supporting the same football club through long rebuilding seasons, and doing my dumbbell sets
      when nobody is watching, teach the same lesson: form rises and falls, seasons have slumps, and
      the craft is in showing up for the next match.
    source: "Gemini Argon draft (R8), from soccer and training (Gemini left it out of its own shortlist)"
    tags: [life]
    photo: TODO
    status: draft
  - id: whats-in-their-hands
    title: "What's already in their hands"
    text: >-
      High-end motion-capture labs are impressive, but a child telling a story doesn't own a
      ten-thousand-dollar rig. They have their hands and their imagination. Good technology
      shouldn't ask people to afford a new world; it should work with what's already in their hands.
    source: "Gemini Argon draft (R9); the low-cost NSF puppet system (HCII 2021) and Hands as Narrators"
    tags: [research, building]
    photo: TODO
    status: draft
