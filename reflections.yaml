  - id: mirrors
    title: "Each person is a mirror"
    text: >-
      Each person close to me is a mirror that reflects a different part of who I am. Through them
      I have learned to understand myself better, to see how I relate to people and to the world,
      and to grow in ways no degree could teach.
    source: "Dissertation acknowledgments"
    tags: [life]
    photo: TODO
    status: draft
  - id: what-a-number-can-tell
    title: "What can a number tell us?"
    text: >-
      Before my defense, my advisor read every slide and asked why each gap mattered, what a number
      could tell us, and how a construct differs from its measure. Those three questions shaped my
      dissertation, and I now ask them of every result — including my own.
    source: "Dissertation acknowledgments (Dr. Chu's questions), reworded as a reflection"
    tags: [research]
    photo: TODO
    status: draft
  - id: night-before
    title: "The night before"
    text: >-
      At the XPRIZE semifinals, our robot's power converter failed the night before testing. We
      couldn't fix everything, so we disconnected the drive train, ran on a borrowed lower-rated
      unit, and kept the one task that would be scored. When things break, protect what matters.
    source: "CV (XPRIZE, Sept 2021)"
    tags: [building]
