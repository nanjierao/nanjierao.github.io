lines:
  - "**Set a page-weight budget before you pick a framework.** I wanted an animated five-scene sketch on my homepage, and my site allows 50 KB per page. React's runtime alone is larger than that, so I drew the scenes as inline SVG with a 3.3 KB script, and mobile load stayed near 2 seconds. Try this: write the budget down first, then check each library's size against it. My judgement: for mostly static personal or lab sites, start with no framework and add one only when the page truly needs to manage state."
  - "**Read a venue's tracks before deciding your work does not fit.** I looked at ICML 2027 for HCI and learning work. Its main track rewards new methods backed by large experiments, which most HCI studies cannot produce before a January deadline. It also takes position papers, where a well-argued claim built on published evidence is the contribution. Try this: list each track's requirements next to the evidence you already have, and pick the one where that evidence is enough. My judgement: a strong argument on a fitting track beats a rushed method paper."
  - '**Log small things while they happen, because you cannot rebuild them later.** Steve Jobs said you can only connect the dots looking back, but that only works if the dots were written down. Reviewing my notes today, the most useful records were short, dated and kept every day, not long reflections written once in a while. Try this: keep one running log with the date, what happened and why it mattered, and read it back once a week. My judgement: a messy log you keep beats a tidy one you skip.'
