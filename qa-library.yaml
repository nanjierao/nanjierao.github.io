# Q&A library for the middle portal (/ask). DRAFT — Jimmy reviews every answer before launch.
# Clicking a suggested question shows the stored answer instantly. Typed questions are matched
# against these answers in the browser (MiniSearch). Only if the optional live mode (S8) is on can
# free text go to Claude, with this library + the site's knowledge pack.
# Rules: answers ≤ 110 words, third person, only facts from content/facts.md, each with sources
# (site paths). status: ready | needs-jimmy | hidden.
items:
  # ── Overview ─────────────────────────────────────────────────────────
  - id: who
    q: "Who is Jimmy Rao, in one paragraph?"
    a: >-
      Nanjie (Jimmy) Rao is a human-computer interaction researcher finishing his Ph.D. in
      Human-Centered Computing at the University of Florida (degree December 2026). He studies what
      AI systems can learn about people — by asking them, or by reading records they already
      produce — and how to check what those systems claim. He also builds hardware and sensing
      systems, from classroom puppet storytelling to a telepresence robot that reached the ANA
      Avatar XPRIZE semifinals.
    sources: [/about/, /research/]
    audience: [general, faculty, industry]
    status: ready
  - id: one-line-research
    q: "What is his research about, in one sentence?"
    a: >-
      Where an AI tutor's knowledge of a student's interests should come from — asking the
      student, the tutoring conversation itself, or records like browsing history and social-media
      posts — and how complete, well grounded, and privacy-conscious each route is.
    sources: [/research/interest-identification/]
    audience: [general, faculty]
    status: ready
  - id: background
    q: "What is his academic background?"
    a: >-
      A B.S. in Optical and Electrical Information Engineering from Huazhong University of Science
      and Technology (2016), doctoral coursework in electrical engineering at the University of
      Houston and Texas A&M (2016–2018), and a Ph.D. in Human-Centered Computing at the University
      of Florida (2018–2026), advised by Dr. Sharon Lynn Chu in the Embodied Learning & Experience
      Lab.
    sources: [/cv/]
    audience: [faculty, industry]
    status: ready
  # ── Dissertation ─────────────────────────────────────────────────────
  - id: dissertation
    q: "What is his dissertation about?"
    a: >-
      It asks from what student interests should be identified so LLM tutors can teach through
      them. It judges identification on four constructs — Accuracy, Depth, Richness, and Phase —
      and runs two studies: what students disclose when a tutor asks (35 tutoring transcripts),
      and how browsing history and social-media posts compare as sources an LLM reads (32 students,
      IEEE ICALT 2026).
    sources: [/research/interest-identification/]
    audience: [faculty, general]
    status: ready
  - id: four-constructs
    q: "What are Accuracy, Depth, Richness, and Phase?"
    a: >-
      Accuracy: whether the identified interest is really the student's. Depth: how much
      information beyond the interest's name reaches the tutor, counted in interest information
      units. Richness: how many kinds of information — affect, function, knowledge, engagement.
      Phase: where the interest sits in its development, from situational to individual.
    sources: [/research/interest-identification/]
    audience: [faculty, students]
    status: ready
  - id: study1
    q: "What happens when an AI tutor simply asks students about their interests?"
    a: >-
      In Study 1, every student named an interest, but the reply to the tutor's opening question
      averaged 2.5 units of information and 29% said nothing beyond the name. Knowledge of the
      interest was 10% of what that reply contained but 88% of what students added later while
      using the interest during teaching. More disclosure went with higher perceived usefulness
      (r = .34).
    sources: [/research/interest-identification/]
    audience: [faculty, general]
    status: ready
  - id: study2
    q: "Which is better for finding interests: browsing history or social media?"
    a: >-
      It depends on the goal. In Study 2 (N = 32, IEEE ICALT 2026), browsing history had higher
      precision — 69.8% of proposed interests confirmed vs. 56.3% for posts — while posts carried
      more grounded detail per confirmed interest. Together they added interests missing from
      self-report: 38.2% of each student's validated interests on average. In the dissertation's
      words: browsing history suits finding the right interest, posts suit learning about it.
    sources: [/research/interest-identification/, /publications/]
    audience: [faculty, industry, general]
    status: ready
  - id: grounding
    q: "What is the 'grounded vs. inferred' check?"
    a: >-
      Each fact a model writes about a student is checked against the student's own material.
      In Study 2, 505 of 1,130 units (44.7%) in the extractor's explanations were inferred rather
      than grounded; in Study 1, 34 of 57 units (59.6%) the tutor asserted were inferred. Inferred
      doesn't mean false — it means the student's data doesn't show it.
    sources: [/research/grounding/]
    audience: [faculty, industry]
    status: ready
  - id: privacy
    q: "How does he handle privacy when studying personal data?"
    a: >-
      His Study 2 pipeline used participant self-curation, filtering of sensitive content, and
      non-retention, under an IRB-approved protocol. The Life & You portal on this site follows the
      same idea: try it with a synthetic sample person, or run the prompt in your own AI assistant;
      whatever you paste back is processed in your browser and never stored.
    sources: [/research/interest-identification/, /privacy/]
    audience: [general, faculty]
    status: ready
  - id: iiu
    q: "What is an interest information unit (IIU)?"
    a: >-
      One distinct fact stated about an interest beyond its name — for example, how long someone
      has done it or why they enjoy it. Counting units measures Depth; counting the categories they
      fall into (affect, function, knowledge, engagement) measures Richness.
    sources: [/research/interest-identification/]
    audience: [faculty, students]
    status: ready
  - id: reusable
    q: "Are his research materials reusable?"
    a: >-
      Yes. The coding scheme with worked examples and rules, the survey instrument, and the
      extraction prompts with synthetic examples are offered as reusable materials in the
      dissertation's appendices; the prompts and synthetic input–output examples are also in the
      ICALT 2026 supplementary repository.
    sources: [/research/interest-identification/]
    audience: [faculty]
    status: needs-jimmy   # add the GitHub URL
  # ── Other research lines ─────────────────────────────────────────────
  - id: digital-twin
    q: "What is the crowd-sourced urban digital twin work?"
    a: >-
      Sense–Engage–Govern is a design framework for gamified, LLM-assisted crowd-sourced urban
      digital twins, presented orally at DTRUE 2026. The CS-UDT prototype for
      Jacksonville flooding confirms an event only when an official sensor anomaly, a resident's
      report, and a social post agree in the same map cell. In a simulated Hurricane Irma replay,
      the first three-channel confirmation came 10.8 hours into a 30-hour window.
    sources: [/research/civic-digital-twins/, /demos/csudt/]
    audience: [faculty, industry]
    status: ready
  - id: hand-enactment
    q: "What did he find about hands and storytelling?"
    a: >-
      In "Hands as Narrators" (ICIDS 2026), writers first acted out story ideas with their hands,
      then wrote. A remote platform logged every video scrub and keystroke with webcam gaze.
      Across 24 participants, returning to the recorded hand enactments took about a quarter of
      writing time; the paper identifies four strategies and five behaviorally inferred reasons.
    sources: [/research/embodied-learning/, /hands/]
    audience: [faculty, general]
    status: ready
  - id: ar-glasses
    q: "What did his AR smart-glasses study show?"
    a: >-
      He built two Android apps for Vuzix Blade glasses — one showing information when the camera
      recognized an object, one on a spoken request — and compared them with 25 participants (IEEE
      VR 2020). Speech-triggered display produced better learning and task scores; object-anchored
      display produced higher immersion and usability.
    sources: [/builds/ar-smart-glasses/]
    audience: [industry, faculty]
    status: ready
  - id: teacher-support
    q: "Has he worked on tools for teachers?"
    a: >-
      Yes. He surveyed 81 studies of teacher-support technologies, coded on teacher autonomy versus
      automation, and published three teacher-facing papers on retrieving and visualizing students'
      experiences (IEEE ICALT 2021 — best short paper nomination; HCI International 2022; IEEE
      ICALT 2023). An update covering generative-AI systems is in preparation.
    sources: [/research/teacher-support/]
    audience: [faculty]
    status: ready
  - id: publications
    q: "Where has he published?"
    a: >-
      Twelve peer-reviewed papers, including first-author work at IEEE ICALT (2021, 2023, 2026),
      ICIDS (2019, 2026), HCI International (2021, 2022), and IEEE VR (2020), plus co-authored
      papers at ACM CHI 2020, AAAI HCOMP 2020, and IFIP INTERACT 2023, and a DTRUE 2026 extended
      abstract with an oral presentation.
    sources: [/publications/]
    audience: [faculty]
    status: ready
  # ── Building / technical ─────────────────────────────────────────────
  - id: hardware
    q: "Does he build hardware, or only software?"
    a: >-
      Both. He trained in electrical engineering (PCB design, FPGA, microcontrollers), built a
      puppet system that fuses a YOLO detector with IMU sensors, assembled and led the on-site team
      for a 300+ lb telepresence robot at the XPRIZE semifinals, and designed a wearable baby
      thermometer that was later commercialized. He is his lab's go-to person for soldering.
    sources: [/builds/]
    audience: [industry, general]
    status: ready
  - id: puppet-system
    q: "How does the digital puppet system work?"
    a: >-
      3D-printed puppets are tracked in real time: position from a YOLO detector trained on 148
      labeled images, rotation from BBC micro:bit and Aimxy IMU sensors over Bluetooth, and a Python
      bridge streams both into Unity, where avatars animate. It was part of the NSF project "To
      Enact, To Tell, To Write" and was supported on site with elementary-school teachers.
    sources: [/builds/puppet-system/]
    audience: [industry, faculty]
    status: ready
  - id: xprize
    q: "What happened at the XPRIZE semifinals?"
    a: >-
      He was on-site leader of four-person Team Limitless at the ANA Avatar XPRIZE semifinals in
      Miami (September 2021), among 37 teams from 15 countries. When the power converter failed
      the night before testing, he re-scoped the robot to keep the scored manipulation task. The
      team reached the semifinals.
    sources: [/builds/xprize-avatar/]
    audience: [industry, general]
    status: ready
  - id: llm-skills
    q: "What is his experience with LLMs?"
    a: >-
      He builds LLM pipelines with OpenAI, Claude, and Gemini models — structured outputs,
      retrieval, tool use — and evaluates them like measurement instruments, including checking
      each generated claim against its source. Examples: the interest-extraction pipeline in his
      dissertation, GPT-4o vision for recognizing hands-on activities, and the LLM parsing stage of
      the flood digital twin.
    sources: [/builds/, /research/]
    audience: [industry]
    status: ready
  - id: stack
    q: "What languages and tools does he use?"
    a: >-
      Python, R, and SQL for analysis; TypeScript/JavaScript (React), Node.js, Flask, C#, C/C++,
      and Java/Android for systems; Unity 3D for real-time 3D; PyTorch, scikit-learn, and OpenCV for
      ML; Docker Compose and Git; MAXQDA and Taguette for qualitative coding.
    sources: [/cv/]
    audience: [industry]
    status: ready
  - id: methods
    q: "What research methods does he use?"
    a: >-
      Within-subjects and mixed-methods designs; two-coder qualitative analysis with written
      decision rules; generalized estimating equations, bootstrap and jackknife resampling, and
      multiple-comparison control; IRB protocols with privacy safeguards.
    sources: [/research/]
    audience: [faculty, industry]
    status: ready
  # ── Teaching & mentoring ─────────────────────────────────────────────
  - id: teaching
    q: "What has he taught?"
    a: >-
      As a UF teaching assistant since 2018: he leads the weekly discussion sections of COP 3530
      Data Structures & Algorithms for about 150 students (Fall 2026), worked on CIS 4360 Computer &
      Information Security, and co-taught the graduate courses CAP 5100 Human-Computer Interaction
      and CAP 5108 Research Methods. Earlier, he taught English in an after-school program and
      tutored K-12 students.
    sources: [/teaching/]
    audience: [faculty, students]
    status: ready
  - id: mentoring
    q: "Has he mentored students?"
    a: >-
      Yes. In the ELX Lab he onboarded and mentored graduate and undergraduate research assistants
      in qualitative coding, inter-rater reliability, and documentation. As an undergraduate he
      founded Galaxy Studio, a student hardware and software studio whose teams won 8 national and
      21 university-level awards.
    sources: [/teaching/, /about/]
    audience: [faculty]
    status: ready
  - id: courses-could-teach
    q: "What could he teach?"
    a: >-
      His listed teaching interests: programming and data structures; HCI and human-centered
      design; research methods; prototyping and physical computing (Arduino, 3D printing, Fusion
      360); and AI literacy, including checking what AI tools assert.
    sources: [/teaching/]
    audience: [faculty]
    status: ready
  # ── Honors & talks ───────────────────────────────────────────────────
  - id: honors
    q: "Any awards?"
    a: >-
      CISE Gartner Group Graduate Fellowship four times (2021–2024), a best short paper nomination
      at IEEE ICALT 2021, ANA Avatar XPRIZE semifinalist (2021), and the Outstanding Thesis Award
      (top 1%) at Huazhong University of Science and Technology.
    sources: [/cv/]
    audience: [faculty, industry]
    status: ready
  - id: talk-dtrue
    q: "Is he giving any talks soon?"
    a: >-
      An oral presentation of the Sense–Engage–Govern framework at DTRUE 2026 on UF's Jacksonville
      campus, November 19–20, 2026. The flood demo from the talk is live on this site.
    sources: [/talks/dtrue-2026/, /demos/csudt/]
    audience: [general]
    status: ready
  # ── The site itself ──────────────────────────────────────────────────
  - id: about-this-assistant
    q: "How does this assistant work?"
    a: >-
      Every answer here was written and reviewed by Jimmy. When you type a question, the page
      searches those answers in your browser and shows the closest ones; if none fits, it says so
      and points you to email. Nothing you type leaves your browser.
    sources: [/privacy/]
    audience: [general]
    status: ready
  - id: about-hands
    q: "What is the Hands portal?"
    a: >-
      A small hand-tracking demo. It opens by playing stories performed with Jimmy's recorded hand
      movements; with your permission, your webcam can take over and turn your hand into the
      storytelling puppet, processed entirely in your browser. It nods to his research on hand
      enactment and puppet storytelling.
    sources: [/hands/]
    audience: [general]
    status: ready
  - id: about-life
    q: "What is the Life & You portal?"
    a: >-
      Short reflections from Jimmy's life, then a hands-on version of his research. Try it with a
      synthetic sample person, or run a prompt in your own AI assistant on your posts, browsing
      history, or what it remembers about you, and paste its answer back. You see which interests
      it found and which of its claims your records support, confirm or reject them, and get a
      short lesson taught through one of your interests.
    sources: [/life/]
    audience: [general]
    status: ready
  - id: how-built
    q: "How was this site built?"
    a: >-
      Jimmy planned it and reviews every change before it goes live. Claude Code writes the code as
      pull requests that he merges, open-source projects do the heavy lifting (credited on the
      Credits page), and every fact comes from one file he maintains. The site is static, built by
      GitHub Actions and hosted on GitHub Pages, with its source code public.
    sources: [/credits/]
    audience: [general, industry]
    status: needs-jimmy   # Jimmy approves the wording once S1 is live
